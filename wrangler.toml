name = "scanlake-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGIN = "*"

# Read-only access to the data bucket.
[[r2_buckets]]
binding = "SCANLAKE_BUCKET"
bucket_name = "scanlake-data"

# Write access for structured access logs.
[[r2_buckets]]
binding = "SCANLAKE_LOGS"
bucket_name = "scanlake-logs"

# Derived data (consolidated datasets, results) written by ScanLake Refinery.
# Readable by any key; writable only by keys with the "derived:write" scope.
[[r2_buckets]]
binding = "SCANLAKE_DERIVED"
bucket_name = "scanlake-derived"

[durable_objects]
bindings = [
  { name = "RATE_LIMITER", class_name = "RateLimiter" },
  { name = "LOG_BUFFER",   class_name = "LogBuffer"   },
]


[[kv_namespaces]]
binding = "API_KEYS"
id = "ac8fe738c3014c49b0a986af12af23f9"
preview_id = "b7c163bedd4644e8bd010e4d57252ca1"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "LogBuffer"]
